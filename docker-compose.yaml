services:
  # --- ИНФРАСТРУКТУРА ---

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper_service
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_service
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  init-kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: init_kafka_service
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "sh", "-c", "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic email_campaigns --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --describe --topic email_campaigns;
    " ]

  postgres:
    image: postgres:16-alpine
    container_name: postgres_service
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_service
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- ВАШИ МИКРОСЕРВИСЫ ---

  # 1. Кастомный SMTP-сервер
  smtp-server:
    build: .
    container_name: custom_smtp_server
    command: python smtp_server.py
    ports:
      - "1025:1025"
    environment:
      SMTP_HOST: 0.0.0.0
      SMTP_PORT: 1025

  # 2. Сервис массовых рассылок на Kafka (Producer + 3 Consumers)
  kafka-service:
    build: .
    container_name: kafka_email_service
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      kafka:
        condition: service_healthy
      smtp-server:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: email_campaigns
      KAFKA_CONSUMER_GROUP: email_sender_group
      CUSTOM_SMTP_HOST: smtp-server
      CUSTOM_SMTP_PORT: 1025

  # 3. Воркер фоновых задач Celery (RabbitMQ)
  celery-worker:
    build: .
    container_name: celery_worker_service
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      smtp-server:
        condition: service_started
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      DATABASE_URL: db+postgresql://user:password@postgres:5432/dbname
      SQLALCHEMY_DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/dbname
      CUSTOM_SMTP_HOST: smtp-server
      CUSTOM_SMTP_PORT: 1025

  # 4. Планировщик задач по расписанию Celery Beat
  celery-beat:
    build: .
    container_name: celery_beat_service
    command: celery -A worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      DATABASE_URL: db+postgresql://user:password@postgres:5432/dbname
      SQLALCHEMY_DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/dbname

  # 5. Единая Админка (FastAPI + SQLAdmin)
  admin-panel:
    build: .
    container_name: admin_panel_service
    command: uvicorn admin_app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-service:
        condition: service_started
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/dbname
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      DATABASE_URL: db+postgresql://user:password@postgres:5432/dbname
      KAFKA_SERVICE_URL: http://kafka-service:8001

volumes:
  postgres_data:
